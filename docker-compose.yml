services:

  # ─── Aplicação PHP + Apache ───────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_ci3_app
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - blog_network

  # ─── Nginx (Proxy reverso para o Apache) ──────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: blog_ci3_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - blog_network

  # ─── MySQL 8.0 ────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: blog_ci3_mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-blog_codeigniter}
      MYSQL_USER: ${DB_USERNAME:-blog_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-blog_password}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./blog_codeigniter.sql:/docker-entrypoint-initdb.d/blog_codeigniter.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blog_network

  # ─── PHPMyAdmin ───────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: blog_ci3_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-rootpassword}
    ports:
      - "8085:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - blog_network

# ─── Volumes persistentes ─────────────────────────────────────
volumes:
  mysql_data:

# ─── Rede interna ─────────────────────────────────────────────
networks:
  blog_network:
    driver: bridge
