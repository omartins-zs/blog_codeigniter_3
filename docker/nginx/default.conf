server {
    listen 80;
    server_name localhost;

    # Otimização de Nginx
    # Habilitar GZIP para respostas mais rápidas
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # O resolver interno do Docker garante que o Nginx não pare se o container app for recriado
    resolver 127.0.0.11 valid=30s;
    set $upstream_app app;

    # Proxy reverso para o container Apache (app)
    location / {
        proxy_pass         http://$upstream_app:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Evitar 502 ao recriar o container app
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # Cache agresivo para arquivos estáticos servidos via Nginx
    # O Nginx pode interceptar os arquivos estáticos e servi-los diretamente ou via proxy cache
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        proxy_pass http://$upstream_app:80;
        proxy_set_header Host $http_host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Logs
    access_log /var/log/nginx/blog_ci3_access.log;
    error_log  /var/log/nginx/blog_ci3_error.log;
}
